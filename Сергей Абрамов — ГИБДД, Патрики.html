<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сергей Абрамов — ГИБДД, Патрики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a2236;--orange:#ff8a1f;--white:#f5f8fb;--blue:#2a7de1;--red:#ff3b4a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--white);font:400 1.08rem/1.65 "Golos Text",system-ui,sans-serif;background:linear-gradient(160deg,#0a2236,#0f3a5e 40%,#0a2236 70%,#12335a);background-size:220% 220%;animation:bg 18s ease-in-out infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 100%}}
h1,h2,h3{font-family:"Exo 2",system-ui,sans-serif;margin:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero,.road,main,footer,.belt{position:relative;z-index:1}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px 70px;overflow:hidden}
.siren{position:absolute;top:-10vh;width:60vw;height:60vw;max-width:700px;max-height:700px;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.siren.r{left:-18vw;background:radial-gradient(circle,var(--red),transparent 65%);animation:pulse 2.4s ease-in-out infinite}
.siren.b{right:-18vw;background:radial-gradient(circle,var(--blue),transparent 65%);animation:pulse 2.4s ease-in-out 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.08}50%{opacity:.7}}
.stage{position:relative;z-index:1;width:min(78vw,340px);aspect-ratio:1/1.5;display:grid;place-items:end center;perspective:900px}
.ring{position:absolute;inset:10% -18% 8%;border-radius:50%;background:conic-gradient(from 0deg,var(--orange) 0 8%,transparent 8% 25%,var(--white) 25% 31%,transparent 31% 50%,var(--orange) 50% 58%,transparent 58% 75%,var(--white) 75% 81%,transparent 81%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spin 14s linear infinite}
.ring.two{inset:2% -28% 0;animation-duration:22s;animation-direction:reverse;opacity:.45}
.glow{position:absolute;inset:14% -10% 6%;border-radius:50%;background:radial-gradient(circle,rgba(42,125,225,.6),transparent 68%);filter:blur(10px);animation:breathe 4s ease-in-out infinite}
.shadow{position:absolute;left:12%;right:12%;bottom:-2%;height:6%;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(8px);animation:shadow 4s 1.2s ease-in-out infinite}
.char{position:relative;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5));animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both,float 4s 1.2s ease-in-out infinite;transition:transform .15s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{translate:0 -12px}}
@keyframes breathe{50%{transform:scale(1.12);opacity:.8}}
@keyframes shadow{50%{transform:scale(.86);opacity:.7}}
@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.88);filter:blur(12px)}}
.name{position:relative;z-index:1;margin-top:28px;font-weight:800;font-size:clamp(2.6rem,9vw,6.4rem);line-height:.95;letter-spacing:-.01em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .28em}
.name span{display:inline-block;animation:letter .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes letter{from{opacity:0;transform:translateY(60px) rotate(8deg)}}
.role{position:relative;z-index:1;margin:14px 0 0;min-height:2.2em;font:600 clamp(1.1rem,3vw,1.6rem) "Exo 2",sans-serif;color:var(--orange)}
.role::after{content:"";display:inline-block;width:3px;height:1.1em;margin-left:4px;background:var(--orange);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.plate{position:relative;z-index:1;display:inline-flex;align-items:stretch;margin-top:22px;border-radius:10px;background:#fff;color:#111;border:3px solid #111;overflow:hidden;font:800 1.8rem "Exo 2",sans-serif;letter-spacing:.08em;font-variant-numeric:tabular-nums;animation:pop .8s 1.4s cubic-bezier(.3,1.6,.5,1) both}
.plate span{padding:6px 18px;min-width:7.2ch}
.plate i{font-style:normal;width:46px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.8rem;letter-spacing:0;border-left:3px solid #111}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-8deg)}}
.road{height:44px;background:#071a2a;overflow:hidden;border-block:3px solid var(--orange)}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,var(--white) 0 46px,transparent 46px 92px);animation:lane 1.2s linear infinite}
.road b{position:absolute;top:2px;left:0;font-size:30px;line-height:1;animation:drive 9s linear infinite;filter:drop-shadow(0 0 8px rgba(42,125,225,.9))}
@keyframes lane{to{transform:translateX(92px)}}
@keyframes drive{from{transform:translateX(-80px)}to{transform:translateX(105vw)}}
.belt{overflow:hidden;background:var(--orange);color:#1b1206;font:800 1.2rem "Exo 2",sans-serif;padding:10px 0;white-space:nowrap}
.belt div{display:inline-block;animation:belt 22s linear infinite}
.belt span{padding:0 26px}
@keyframes belt{to{transform:translateX(-50%)}}
main{max-width:1040px;margin:0 auto;padding:0 clamp(16px,5vw,40px) 40px}
section{padding-top:clamp(52px,9vw,96px)}
h2{font-size:clamp(1.8rem,5vw,3rem);margin-bottom:22px;position:relative;display:inline-block}
h2::after{content:"";position:absolute;left:0;bottom:-6px;height:4px;width:0;background:var(--orange);border-radius:4px;transition:width .9s .3s cubic-bezier(.2,.8,.2,1)}
.in h2::after{width:100%}
.js .rv{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.js .rv.in,.js .in .rv{opacity:1;transform:none}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tilt{position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .2s}
.tilt::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.tilt:hover::before{opacity:1}
.dos div{padding:20px 22px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dos small{display:block;opacity:.7;font-size:.9rem}
.dos b{font:800 1.35rem "Exo 2",sans-serif}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.gal button{all:unset;cursor:zoom-in;display:block;border-radius:16px;border:2px solid rgba(255,255,255,.2);overflow:hidden}
.gal button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.gal img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;transition:transform .6s}
.gal button:hover img{transform:scale(1.08)}
.js .gal .rv{transform:translateY(50px) rotate(var(--r,0deg)) scale(.92)}
.js .gal .rv.in{transform:none}
.contacts{display:flex;flex-wrap:wrap;gap:14px}
.contacts a,.contacts button{position:relative;font:600 1.05rem "Golos Text",sans-serif;padding:14px 26px;border-radius:14px;border:0;cursor:pointer;text-decoration:none;color:#1b1206;background:var(--orange);transition:transform .2s}
.contacts a.alt{background:var(--white);color:#0a2236}
.contacts a:hover,.contacts button:hover{transform:translateY(-4px) scale(1.04)}
.contacts button::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--orange);animation:ping 2s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35,1.7)}}
.contacts :focus-visible{outline:3px solid #fff;outline-offset:3px}
dialog{border:0;background:transparent;padding:0;max-width:94vw}
dialog::backdrop{background:rgba(3,10,18,.88)}
dialog img{display:block;max-width:94vw;max-height:88vh;border-radius:12px;animation:rise .5s both}
.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;padding:12px 22px;border-radius:99px;background:#fff;color:#0a2236;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.on{opacity:1;translate:-50% 0}
footer{text-align:center;padding:40px 20px 60px;opacity:.6;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>

<script>
document.documentElement.classList.add('js');
var still=matchMedia('(prefers-reduced-motion:reduce)').matches,$=function(i){return document.getElementById(i)};
// имя по буквам и печать должности
var nm=$('name');'Сергей Абрамов'.split(' ').forEach(function(w,wi){var s=document.createElement('span');s.style.display='inline-flex';s.setAttribute('aria-hidden','true');w.split('').forEach(function(ch,i){var l=document.createElement('span');l.textContent=ch;l.style.animationDelay=(.5+wi*.35+i*.06)+'s';s.appendChild(l)});nm.appendChild(s)});
var role=$('role'),full='Заместитель БП ГИБДД';
if(still){role.textContent=full}else{var k=0;setTimeout(function(){var t=setInterval(function(){role.textContent=full.slice(0,++k);if(k>=full.length)clearInterval(t)},60)},1300)}
// табло номера: цифры «крутятся» и встают на место
var pl=$('plate'),fin='207-331';
pl.textContent=fin;
// бегущая строка
var parts=['ГИБДД','Патрики','207-331','Заместитель БП'],bt='';for(var q=0;q<8;q++)parts.forEach(function(p){bt+='<span>'+p+'</span><span>★</span>'});$('belt').innerHTML=bt;
// появление при прокрутке
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
[].forEach.call(document.querySelectorAll('.rv,section'),function(el){io.observe(el)});
// наклон и блик на карточках
[].forEach.call(document.querySelectorAll('.tilt'),function(c){
  if(still)return;
  c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.style.transform='perspective(700px) rotateY('+((x-.5)*12)+'deg) rotateX('+((.5-y)*12)+'deg) scale(1.03)'});
  c.addEventListener('pointerleave',function(){c.style.transform=''});
});
// персонаж: наклон за курсором и сдвиг при прокрутке
var ch=$('char'),st=$('stage');
if(!still){addEventListener('pointermove',function(e){var x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;ch.style.transform='rotateY('+(x*12)+'deg) rotateX('+(-y*5)+'deg)'});
  addEventListener('scroll',function(){st.style.translate='0 '+Math.min(scrollY*.18,120)+'px'},{passive:true})}
// частицы на фоне
var cv=$('fx'),x=cv.getContext('2d'),W,H,P=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
for(var i=0;i<46;i++)P.push({x:Math.random(),y:Math.random(),r:1+Math.random()*3,v:.0003+Math.random()*.0008,c:Math.random()<.5?'255,138,31':'245,248,251',ph:Math.random()*6.28});
function fr(ts){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.v;if(p.y<-.03){p.y=1.03;p.x=Math.random()}var a=.15+.25*Math.sin(ts/900+p.ph);x.fillStyle='rgba('+p.c+','+a+')';x.beginPath();x.arc((p.x+Math.sin(ts/2000+p.ph)*.01)*W,p.y*H,p.r,0,6.28);x.fill()});if(!still)requestAnimationFrame(fr)}
requestAnimationFrame(fr);
// галерея на весь экран и копирование Discord
var dlg=$('dlg'),big=$('big');
[].forEach.call(document.querySelectorAll('.gal button'),function(b){b.onclick=function(){var im=b.querySelector('img');big.src=im.src;big.alt=im.alt;dlg.showModal()}});
dlg.addEventListener('click',function(){dlg.close()});
var t=$('toast');$('dc').onclick=function(){var ok=function(){t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)};try{navigator.clipboard.writeText('@dirgs').then(ok,ok)}catch(e){ok()}};
</script>
